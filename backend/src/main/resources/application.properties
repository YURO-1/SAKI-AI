spring.application.name=saki-backend
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/saki_ai}
spring.datasource.username=${DB_USERNAME:saki}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

saki.ml-service.base-url=${ML_SERVICE_URL:http://127.0.0.1:8000}
saki.jwt.secret=${SAKI_JWT_SECRET}
saki.admin.email=${SAKI_ADMIN_EMAIL:}
saki.admin.password=${SAKI_ADMIN_PASSWORD:}
saki.research.tavily.api-key=${TAVILY_API_KEY:}
